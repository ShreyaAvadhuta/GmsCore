name: Build GmsCore (PolicyEngine)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Correct way to install Android SDK bits (sdkmanager package names)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build (assemble everything) — adjust if you want only debug:
      - name: Assemble
        run: ./gradlew assemble --no-daemon

      # Print out where APKs actually landed
      - name: List APK outputs
        run: |
          echo "Searching for APKs..."
          find . -type f -name "*.apk" -printf "%p\n"

      # Super-broad pattern so we don't miss the APK no matter the module name
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: microg-policyengine-apks
          path: |
            **/build/outputs/**/*.apk
          if-no-files-found: warn
