name: Build GmsCore (PolicyEngine)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Install Android SDK bits via sdkmanager package names
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build everything; if your edits are only in GmsCore, this suffices
      - name: Assemble
        run: ./gradlew assemble --no-daemon

      # Show exactly where APKs landed
      - name: List APK outputs
        run: |
          echo "=== APKs found ==="
          find . -type f -name "*.apk" -printf "%p\n" || true

      # Broad patterns so we don't miss anything regardless of module name/layout
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: microg-policyengine-apks
          path: |
            **/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
